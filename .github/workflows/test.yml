name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/test.txt
          printf 'marker\n' > content/a
          printf 'x\n' > 'content/a;id;hostname;uname -a;true;#.txt'
          printf '1\n' > content/pr_number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
